<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=
    ">
    <title>Chai aur code | DOM</title>
</head>
<body style="background-color: #212121; color: white;">
    <ul class="language">
        <li>Javascript</li>
    </ul>
</body>
<script>
//basic way of adding more to webpage
    function addLanguage(langName){
        const li = document.createElement('li')
        li.innerHTML = `$(langName)`
        document.querySelector('.language').appendChild(li)

    }
    addLanguage("Python")
    addLanguage("TyrpeScript")

    //using DSA //optimised way
    function addOptiLanguage(langName){
        const li = document.createElement('li')
        li.appendChild(document.createTextNode(langName))
        document.querySelector('.language').appendChild(li)
    }
    addOptiLanguage('goLang')

    //EDIT VALUES

    const secondLang = document.querySelector("li:nth-child(2)") //selecting 2nd child
    //change the second laguage
    //second.innerHTML = "Mojo"       //not optimised way

    //optimised way
    const newli = document.createElement('li')
    newli.textContent = "Mojo"
    secondLang.replaceWith(newli)

    //edit
    const firstLang = document.querySelector("li:first-child")
    firstLang.outerHTML = '<li>TypeScript</li>'

    //remove
    const lastLang = document.querySelector('li:last-child')
    lastLang.remove()

</script>
</html>
